<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР 03 — сеанс</title>
</head>
<body>
  <h1>Навчальний сеанс</h1>

  <h2>Стан сеансу</h2>
  <p id="anonymous" hidden>Не ввійшли.</p>
  <p id="signed-in" hidden>Сеанс активний.</p>
  <p id="unknown">Стан ще не перевірено.</p>
  <pre id="result" role="status"></pre>

  <h2>Реєстрація</h2>
  <form id="register">
    <label>Ім’я користувача <input name="userName" autocomplete="username" required maxlength="256"></label>
    <label>Email <input name="email" type="email" autocomplete="email" required maxlength="256"></label>
    <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
    <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
    <button>Зареєструватися</button>
  </form>

  <h2>Вхід</h2>
  <form id="login">
    <label>Ім’я <input name="userName" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Увійти</button>
  </form>

  <h2>Мій профіль</h2>
  <button id="me" type="button">Мій профіль</button>
  <button id="logout" type="button">Вийти</button>
  <dl>
    <dt>Id</dt><dd id="profile-userId">—</dd>
    <dt>Ім’я користувача</dt><dd id="profile-userName">—</dd>
    <dt>Роль</dt><dd id="profile-role">—</dd>
  </dl>

  <h2>Новий інцидент</h2>
  <form id="incident">
    <label>Заголовок <input name="title" required maxlength="160"></label>
    <label>Опис <textarea name="description" required maxlength="4000"></textarea></label>
    <label>Критичність
      <select name="severity" required>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Critical</option>
      </select>
    </label>
    <label>Час виникнення <input name="occurredAt" type="datetime-local" required></label>
    <button>Створити</button>
  </form>
  <p id="incident-result"></p>

  <script type="module" src="auth-lab.js"></script>
</body>
</html>
